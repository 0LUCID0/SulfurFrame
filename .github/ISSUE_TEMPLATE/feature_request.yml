name: Feature request
description: An idea for SulfurFrame
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you'd like to do, and what gets in the way today.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Loader and Minecraft version you work with
      description: Other loaders and versions are planned; knowing what people use helps decide the order.
